name: CI/CD Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./Project 
          file: ./Project/Dockerfile 
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-video-tool:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ai-video-tool:latest
            docker stop ai-video-app || true
            docker rm ai-video-app || true
            
            # 서버에 데이터 폴더 생성 (없으면)
            mkdir -p /home/ubuntu/ai-video-data/outputs
            mkdir -p /home/ubuntu/ai-video-data/projects
            mkdir -p /home/ubuntu/ai-video-data/temp
            
            # 볼륨 마운트: 서버의 폴더와 도커 내부 폴더 연결 (배포 후에도 데이터 유지)
            docker run -d --name ai-video-app \
              -p 8000:8000 \
              -v /home/ubuntu/ai-video-data:/app/data \
              -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
              -e FAL_KEY=${{ secrets.FAL_KEY }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/ai-video-tool:latest