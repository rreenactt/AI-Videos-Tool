name: CI/CD Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./Project 
          file: ./Project/Dockerfile 
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-video-tool:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ai-video-tool:latest
            docker stop ai-video-app || true
            docker rm ai-video-app || true
            # 컨테이너 실행 시 FAL_KEY도 환경변수로 넣어줍니다.
            docker run -d --name ai-video-app \
              -p 8000:8000 \
              -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
              -e FAL_KEY=${{ secrets.FAL_KEY }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/ai-video-tool:latest