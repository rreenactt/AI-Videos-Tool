name: CI/CD Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./Project 
          file: ./Project/Dockerfile 
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ai-video-tool:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # 1. 최신 이미지 가져오기
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ai-video-tool:latest
            
            # 2. 기존 컨테이너 중지 및 삭제 (이름 충돌 방지를 위해 두 이름 모두 정리)
            docker stop ai-video-app ai-shorts-app || true
            docker rm ai-video-app ai-shorts-app || true
            
            # 3. 안 쓰는 이미지 및 컨테이너 정리 (디스크 용량 확보)
            docker system prune -f
            
            # 4. 서버에 데이터 폴더 생성 (없으면)
            mkdir -p /home/ubuntu/ai-video-data/outputs
            mkdir -p /home/ubuntu/keys
            
            # 2. 새로운 설정으로 최종 실행
            docker run -d --name ai-video-app \
              -p 8000:8000 \
              -v /home/ubuntu/ai-video-data:/app/data \
              -v /home/ubuntu/keys/google_creds.json:/app/google_creds.json \
              -e GOOGLE_APPLICATION_CREDENTIALS=/app/google_creds.json \
              -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }} \
              -e FAL_KEY=${{ secrets.FAL_KEY }} \
              -e GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/ai-video-tool:latest